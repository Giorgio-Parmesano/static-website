<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#faf3e0"/>
  <!-- Plate -->
  <ellipse cx="100" cy="115" rx="75" ry="45" fill="#f0ebe0"/>
  <ellipse cx="100" cy="115" rx="67" ry="38" fill="#fff"/>
  <!-- Cannoli 1 -->
  <rect x="55" y="100" width="55" height="20" rx="10" fill="#c8a050"/>
  <rect x="55" y="100" width="55" height="20" rx="10" fill="#d8b060" opacity="0.7"/>
  <!-- Shell texture -->
  <circle cx="70" cy="110" r="1.5" fill="#b89040" opacity="0.5"/>
  <circle cx="85" cy="108" r="1.5" fill="#b89040" opacity="0.5"/>
  <circle cx="95" cy="112" r="1.5" fill="#b89040" opacity="0.5"/>
  <!-- Ricotta filling ends -->
  <circle cx="55" cy="110" r="10" fill="#faf5e8"/>
  <circle cx="110" cy="110" r="10" fill="#faf5e8"/>
  <!-- Chocolate chips -->
  <circle cx="53" cy="108" r="2" fill="#4a2a10"/>
  <circle cx="58" cy="113" r="1.5" fill="#4a2a10"/>
  <circle cx="108" cy="107" r="2" fill="#4a2a10"/>
  <circle cx="112" cy="112" r="1.5" fill="#4a2a10"/>
  <!-- Pistachios -->
  <circle cx="50" cy="112" r="2" fill="#6a9a40"/>
  <circle cx="114" cy="109" r="2" fill="#6a9a40"/>
  <!-- Cannoli 2 (behind) -->
  <rect x="80" y="92" width="50" height="18" rx="9" fill="#c8a050" opacity="0.8"/>
  <circle cx="80" cy="101" r="9" fill="#faf5e8"/>
  <circle cx="130" cy="101" r="9" fill="#faf5e8"/>
  <circle cx="78" cy="99" r="1.5" fill="#4a2a10"/>
  <circle cx="132" cy="100" r="1.5" fill="#4a2a10"/>
  <!-- Powdered sugar -->
  <circle cx="90" cy="105" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="100" cy="103" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="75" cy="107" r="0.8" fill="#fff" opacity="0.7"/>
